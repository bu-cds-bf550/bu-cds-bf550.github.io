# Site settings
# `title` is the masthead label, so keep it short — the full course name is the home page's
# own title. `description` is what search engines and link previews show.
title: BF550
subtitle: Applied Statistics & Machine Learning for the Life Sciences
description: Applied statistics and machine learning for the life sciences at Boston University — taught for code literacy in the age of coding agents.
baseurl: "" # the subpath of your site
url: "https://bu-cds-bf550.github.io" # the base hostname & protocol for your site

# The public lab templates: one repository per unit, bf550-unitNN-labs, under this prefix.
# Students accept a copy through Classroom50 at the unit's first meeting; every lab from 2 on
# is a notebook in its unit's template, and `_data/labs.yml` entries carry a `path` within it
# instead of a site page. Lab 1 itself stays a page here: it is where the toolchain is set up.
labs_org: "https://github.com/bu-cds-bf550"

theme: minimal-mistakes-jekyll

# Site-wide search over every published page. The theme bundles lunr; this is the switch.
search: true

# Footer links. This is the key the theme's footer reads; `_data/navigation.yml` is only
# consulted for the masthead (`main`) and the sidebar (`sidebar`).
footer:
  links:
    - label: "Textbook"
      icon: "fas fa-fw fa-book"
      url: "https://bu-cds-bf550.github.io/bf550-textbook/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/bu-cds-bf550/bu-cds-bf550.github.io"
    - label: "Boston University"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://www.bu.edu/"

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache

# Collections
collections:
  units:
    output: true
    permalink: /units/:path/

# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      sidebar:
        nav: "sidebar"
      classes: wide

  # _units
  - scope:
      path: ""
      type: units
    values:
      layout: single
      sidebar:
        nav: "sidebar"
      classes: wide

# Site timezone
timezone: America/New_York

# Lecture decks are rendered by Quarto (see `slides/` and `tools/build_slides.sh`) into
# `_site/slides/`. Jekyll must not delete them when it rebuilds.
keep_files:
  - slides

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - AI_DISCLOSURE.md
  - .gitignore
  - Dockerfile
  - compose.yaml
  - Makefile
  - internal/
  # Instructor-facing material must never be published. `lectures/` is listed because a
  # run-sheet once landed there and shipped; `tools/` because the tripwire lint's own pattern
  # literals would otherwise match themselves in the built output.
  - lectures/
  - tools/
  # Quarto sources for the lecture decks; the rendered output lands in _site/slides/ directly.
  - slides/
