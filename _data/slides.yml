# Published lecture decks. One entry per deck; a unit has one per session it lectures in,
# so `file` is unit-NN-M for unit NN, session M — the same shape labs.yml uses.
# The unit pages and /slides/ read this list, so adding a deck means adding a line here.
#
#   unit     the unit page it surfaces on, matching _units/<unit>.md
#   session  which meeting of the unit, 1-based
#   date     that meeting, spelled as course/docs/schedule.md spells it
#   title    the deck's subject; "(draft)" is appended by tools/banner.py while under review
#   file     slides/<file>.qmd -> /slides/<file>.html and .pdf
