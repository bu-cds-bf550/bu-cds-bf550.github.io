# Published labs. One entry per lab, wherever it lives; the unit pages, the schedule and
# /labs/ all read this list, so adding a lab means adding a line here.
#
#   id      lab 1 is a course-site page: docs/labs/<id>.md -> /labs/<id>/. Every lab from 2
#           on is a notebook in the public labs repo, bu-cds-bf550/bf550-labs, which students
#           clone once in lab 1 and `git pull` to update; those carry `path` too.
#   path    optional: the notebook's path inside the labs repo (site.labs_repo in _config.yml).
#           Present => the lab links there; absent => it links to its own page under /labs/.
#   unit    the unit page it surfaces on, matching _units/<unit>.md
#   date    the meeting it belongs to, spelled as the schedule spells it
#   title   the lab's subject, without the "Lab N ·" prefix the page's own title carries
