# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Build and run the content checks on PRs too, so the instructor-content gate is
  # exercised before merge rather than discovered at deploy time. The deploy job below
  # is guarded so pull requests never publish.
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    # The versions the Dockerfile replicates. Named once so the setup steps and the execution
    # cache key below cannot disagree.
    env:
      QUARTO_VERSION: 1.10.18
      PYTHON_VERSION: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.3'
          bundler-cache: false
          cache-version: 1
      - name: Fix platform compatibility
        run: |
          bundle lock --add-platform x86_64-linux
          bundle install
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      # Lecture decks: Quarto executes slides/*.qmd, decktape prints each deck to PDF with the
      # runner's Chrome.
      - name: Setup Python for the slide decks
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install slide dependencies
        run: pip install -r slides/requirements.txt
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}
      # The decks' execution results. `freeze: auto` in each project's _quarto.yml makes Quarto
      # re-run a deck's Python only when the deck's source has changed, reading and writing the
      # results under slides/_freeze/ and tutorials/_freeze/. Those directories are gitignored,
      # so without this step every run starts empty and executes every deck: about two minutes
      # for the slides against ten seconds of Pandoc when the results are present. The key names
      # the Python requirements and the Quarto and Python versions, because a frozen result is
      # only as good as the environment that produced it; the run id makes it unique so the post
      # step always saves, and restore-keys picks up the latest run with the same environment.
      - name: Restore the deck execution cache
        uses: actions/cache@v4
        with:
          path: |
            slides/_freeze
            tutorials/_freeze
          key: deck-freeze-${{ hashFiles('slides/requirements.txt') }}-quarto${{ env.QUARTO_VERSION }}-py${{ env.PYTHON_VERSION }}-${{ github.run_id }}
          restore-keys: |
            deck-freeze-${{ hashFiles('slides/requirements.txt') }}-quarto${{ env.QUARTO_VERSION }}-py${{ env.PYTHON_VERSION }}-
      # The PDF and .pptx of every deck, keyed on the deck's source and the shared theme and
      # tooling (tools/build_slides.sh --pdf). A unique key each run means the post step always
      # saves the updated directory; restore-keys picks up the most recent one. Without this,
      # decktape re-prints every slide of every deck on every push, about three seconds a slide.
      - name: Restore the deck export cache
        uses: actions/cache@v4
        with:
          path: .deck-export-cache
          key: deck-exports-${{ github.run_id }}
          restore-keys: |
            deck-exports-
      # One script builds the whole site -- Jekyll, then the slide decks and their PDFs, then
      # the gate on the built output -- and `make site` runs the same script in the Dockerfile's
      # replica of this job, so local and deployed builds cannot drift.
      - name: Build the site (Jekyll, slide decks, PDFs, content gate)
        run: tools/build_site.sh
        env:
          BASEURL: ${{ steps.pages.outputs.base_path }}
          CHROME_PATH: /usr/bin/google-chrome
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
